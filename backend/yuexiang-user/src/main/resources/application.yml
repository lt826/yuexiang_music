server:
  port: 8081

spring:
  application:
    name: yuexiang-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        fail-fast: false
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
        file-extension: yaml
  # optional: 配置中心没有 yuexiang-user-dev.yaml 也能启动（连接配置本身走本地）
  config:
    import: optional:nacos:yuexiang-user-dev.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/yuexiang_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 6379
      timeout: 2s

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.qxt.yuexiang: debug
