server:
  port: 8089

spring:
  application:
    name: yuexiang-ai

# Sentinel：控制台地址（本机未启动 dashboard 时自动重试连接，不影响服务）
  sentinel:
    transport:
      dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      port: 8719
    eager: true
  cloud:
    nacos:
      discovery:
        fail-fast: false
        server-addr: ${NACOS_HOST:127.0.0.1}:8848

# DeepSeek OpenAI 兼容接口配置（详细设计见 README）
deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:sk-df73275a780e44f5a8b94d4b8f4c901b}
  model: deepseek-chat
  # 单次 chat 调用超时（Function Calling 会循环多次，总时长另由 service 层控制）
  timeout-seconds: 60

logging:
  level:
    com.qxt.yuexiang: debug
