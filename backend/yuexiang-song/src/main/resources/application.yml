server:
  port: 8082

spring:
  application:
    name: yuexiang-song

# Sentinel：控制台地址（本机未启动 dashboard 时自动重试连接，不影响服务）
  sentinel:
    transport:
      dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      port: 8719
    eager: true
  cloud:
    nacos:
      discovery:
        fail-fast: false
        server-addr: ${NACOS_HOST:127.0.0.1}:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/yuexiang_song?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: 5672
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 6379
      # Redis 挂了各接口降级走 MySQL（热榜退化为播放量排序），不阻塞启动
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

feign:
  sentinel:
    # Feign 调用纳入 Sentinel：异常比例/慢调用超阈值自动熔断，走 fallback 降级
    enabled: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.qxt.yuexiang: debug
